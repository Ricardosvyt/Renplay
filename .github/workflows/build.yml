name: Build RenPlay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar tipos
        run: npx tsc --noEmit
      - name: Verificar lint
        run: npm run lint
      - name: Gerar build do site
        run: npm run build
